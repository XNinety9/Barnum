[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "barnum"
version = "0.3.0"
description = "Horoscopes offline et déterministes, calculés sur le ciel réel (français, anglais)."
requires-python = ">=3.10"
dependencies = []

[project.scripts]
barnum = "barnum.cli:main"

[tool.setuptools]
packages = ["barnum", "barnum.langues"]
